<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>火箭发射 · Rocket Launch</title>
<meta name="description" content="搭建多级火箭，冲过 100 公里卡门线。" />
<style>
  :root{
    --bg:#0b1220; --panel:#141d2e; --panel-2:#1b2739; --line:#26344a;
    --text:#e8eef8; --dim:#93a4bd; --faint:#5d6e88;
    --accent:#ff8a3d; --accent-2:#4cc4ff; --ok:#4ade80;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{height:100%;overscroll-behavior:none}
  body{
    background:#0b1220;color:var(--text);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}

  #scene{position:fixed;inset:0;display:block;width:100%;height:100%}

  /* 标题 */
  .title-wrap{
    position:absolute;top:0;left:0;right:0;text-align:center;
    padding:clamp(20px,5vh,52px) 16px 0;
    padding-top:max(clamp(20px,5vh,52px),env(safe-area-inset-top));
    pointer-events:none;
  }
  h1{
    font-size:clamp(30px,7vw,60px);font-weight:800;letter-spacing:-1px;line-height:1.05;
    text-shadow:0 3px 18px rgba(0,0,0,.55);
  }
  h1 span{color:var(--accent)}
  .sub{
    margin-top:8px;font-size:clamp(12px,2.4vw,15px);color:#cfe0f5;letter-spacing:3px;
    text-shadow:0 2px 10px rgba(0,0,0,.6);
  }

  /* 建筑热区：绝对定位在画布坐标上，由 JS 同步位置 */
  .hotspot{
    position:absolute;transform:translate(-50%,-100%);
    display:flex;flex-direction:column;align-items:center;gap:7px;
    -webkit-tap-highlight-color:transparent;
  }
  .hs-label{
    padding:7px 15px;border-radius:999px;white-space:nowrap;
    background:rgba(12,18,32,.82);border:1px solid rgba(255,255,255,.22);
    font-size:13.5px;font-weight:700;letter-spacing:.5px;
    backdrop-filter:blur(8px);
    box-shadow:0 6px 18px rgba(0,0,0,.4);
    transition:transform .18s,background .18s,border-color .18s;
  }
  .hs-label small{display:block;font-weight:500;font-size:10.5px;color:var(--dim);letter-spacing:1px;margin-top:1px}
  .hotspot:hover .hs-label,.hotspot:focus-visible .hs-label{
    transform:translateY(-4px);background:rgba(20,30,50,.95);border-color:var(--accent);
  }
  .hs-arrow{
    width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;
    border-top:9px solid rgba(255,255,255,.5);
    animation:bob 2.2s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
  @media (prefers-reduced-motion:reduce){.hs-arrow{animation:none}}

  /* 机库弹窗 */
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:rgba(5,9,18,.78);backdrop-filter:blur(5px);padding:16px}
  .modal[hidden]{display:none}
  .sheet{
    width:min(560px,100%);max-height:min(86vh,720px);display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.6);
  }
  .sheet-head{
    display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);
    background:linear-gradient(120deg,rgba(76,196,255,.12),transparent);
  }
  .sheet-head h2{font-size:17px;font-weight:750}
  .sheet-head p{font-size:12px;color:var(--dim);margin-top:2px}
  .sheet-head .x{margin-left:auto;width:32px;height:32px;border-radius:9px;background:var(--panel-2);
    border:1px solid var(--line);font-size:15px;color:var(--dim);line-height:1}
  .sheet-head .x:hover{color:var(--text);background:#2c3c54}

  .ship-list{overflow-y:auto;overscroll-behavior:contain;padding:12px;display:flex;flex-direction:column;gap:9px}
  .ship{
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;
    padding:13px 14px;border-radius:12px;text-align:left;width:100%;
    background:var(--panel-2);border:1px solid var(--line);
    transition:border-color .16s,background .16s,transform .16s;
  }
  .ship:hover,.ship:focus-visible{border-color:var(--accent);background:#22314a;transform:translateX(3px);outline:none}
  .ship.is-preset{border-left:3px solid var(--accent-2)}
  .ship-mini{display:flex;flex-direction:column-reverse;align-items:center;gap:1px;width:22px}
  .ship-mini i{display:block;border-radius:1px}
  .ship-name{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px}
  .tagp{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;
    background:rgba(76,196,255,.18);color:var(--accent-2);letter-spacing:.5px}
  .ship-meta{font-size:11.5px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}
  .ship-apo{font-size:15px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums;text-align:right}
  .ship-apo small{display:block;font-size:10px;color:var(--faint);font-weight:500}
  .empty{padding:34px 20px;text-align:center;color:var(--faint);font-size:13px;line-height:2}
  .sheet-foot{padding:12px 20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);text-align:center}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="title-wrap">
  <h1>火箭<span>发射</span></h1>
  <div class="sub">ROCKET LAUNCH</div>
</div>

<!-- 建筑热区（位置由 JS 按画布布局同步） -->
<button class="hotspot" id="hsVab">
  <span class="hs-label">🏗 火箭制造大楼<small>建造并发射</small></span>
  <span class="hs-arrow"></span>
</button>
<button class="hotspot" id="hsRadar">
  <span class="hs-label">📡 雷达站<small>机库 · 已入轨飞船</small></span>
  <span class="hs-arrow"></span>
</button>

<!-- 机库 -->
<div class="modal" id="fleetModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="机库">
    <div class="sheet-head">
      <div>
        <h2>📡 雷达站 · 机库</h2>
        <p>所有抵达 100 km 卡门线的飞船。点击即可载入制造车间。</p>
      </div>
      <button class="x" id="fleetClose" aria-label="关闭">✕</button>
    </div>
    <div class="ship-list" id="shipList"></div>
    <div class="sheet-foot" id="fleetFoot"></div>
  </div>
</div>

<script src="parts.js"></script>
<script src="fleet.js"></script>
<script src="home.js"></script>
</body>
</html>
